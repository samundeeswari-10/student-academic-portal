<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>

<body>

<div class="sidebar">
    <h2>Student Portal</h2>

    <a href="admin-dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="faculty.html">Faculty</a>
    <a href="subjects.html">Subjects</a>
    <a href="assignments.html">Assignments</a>
    <a href="attendance.html">Attendance</a>
    <a href="marks.html">Marks</a>

    <button onclick="logout()">Logout</button>
</div>

<div class="main">

    <div class="topbar">
        <div>
            <h1>Admin Dashboard</h1>
            <p>Manage the Student Academic Portal</p>
        </div>

        <div class="admin-info">
            <strong id="adminName">Admin</strong>
            <span>Administrator</span>
        </div>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <p id="studentCount">0</p>
        </div>

        <div class="card">
            <h3>Total Faculty</h3>
            <p id="facultyCount">0</p>
        </div>

        <div class="card">
            <h3>Total Subjects</h3>
            <p id="subjectCount">0</p>
        </div>

        <div class="card">
            <h3>Total Assignments</h3>
            <p id="assignmentCount">0</p>
        </div>

    </div>

    <div class="section">
        <h2>Quick Actions</h2>

        <div class="actions">

            <button onclick="manageStudents()">
                Manage Students
            </button>

            <button onclick="manageFaculty()">
                Manage Faculty
            </button>

            <button onclick="manageSubjects()">
                Manage Subjects
            </button>

            <button onclick="manageAssignments()">
                Manage Assignments
            </button>

        </div>
    </div>

</div>

<script src="js/admin-dashboard.js"></script>

</body>
</html>

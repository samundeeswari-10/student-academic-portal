
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/students.css">
</head>
<body>
<div class="sidebar">
    <h2>Student Portal</h2>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="faculty.html">Faculty</a>
    <a href="subjects.html">Subjects</a>
    <a href="assignments.html">Assignments</a>
    <a href="attendance.html">Attendance</a>
    <a href="marks.html">Marks</a>
    <button onclick="logout()">Logout</button>
</div>

<div class="main-content">
    <h1>Assignment Management</h1>
    <p>Manage assignments, descriptions, and due dates.</p>

    <button type="button" onclick="showAssignmentForm()">
        + Add Assignment
    </button>

    <div id="assignmentFormContainer" style="display: none;">
        <h2 id="formTitle">Add Assignment</h2>

        <form id="assignmentForm">
            <label for="title">Assignment Title</label>
            <input type="text" id="title" required>

            <label for="description">Description</label>
            <textarea id="description" rows="4" required></textarea>

            <label for="subject">Subject</label>
            <select id="subject" required>
                <option value="">Select Subject</option>
            </select>

            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" required>

            <button type="submit">Save Assignment</button>
            <button type="button" onclick="hideAssignmentForm()">
                Cancel
            </button>
        </form>
    </div>

    <p id="assignmentMessage"></p>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Subject</th>
                <th>Due Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="assignmentTableBody">
            <tr>
                <td colspan="6">Loading assignments...</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="js/assignments.js"></script>
</body>
</html>

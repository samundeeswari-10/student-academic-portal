<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <link rel="stylesheet" href="css/students.css">
</head>

<body>

<div class="sidebar">

    <h2>Student Portal</h2>

    <a href="admin-dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="faculty.html">Faculty</a>
    <a href="subjects.html">Subjects</a>
    <a href="assignments.html">Assignments</a>
    <a href="attendance.html">Attendance</a>
    <a href="marks.html">Marks</a>

    <button onclick="logout()">Logout</button>

</div>

<div class="main">

    <div class="topbar">

        <div>
            <h1>Manage Students</h1>
            <p>View and manage student records</p>
        </div>

        <button class="add-btn" onclick="showAddStudent()">
            + Add Student
        </button>

        <div id="studentFormContainer" style="display:none;">

            <h2 id="studentFormTitle">Add Student</h2>

            <form id="studentForm">

                <input
                        type="text"
                        id="studentName"
                        placeholder="Student Name"
                        required
                >

                <input
                        type="email"
                        id="studentEmail"
                        placeholder="Email"
                        required
                >

                <input
                        type="text"
                        id="studentDepartment"
                        placeholder="Department"
                        required
                >

                <input
                        type="number"
                        id="studentYear"
                        placeholder="Year"
                        min="1"
                        max="4"
                        required
                >

                <button type="submit" id="saveStudentButton">
                    Save Student
                </button>

                <button
                        type="button"
                        onclick="hideStudentForm()">
                    Cancel
                </button>

            </form>

        </div>
    </div>

    <div id="message"></div>

    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="studentTableBody">
            <tr>
                <td colspan="6">Loading students...</td>
            </tr>
            </tbody>

        </table>

    </div>

</div>

<script src="js/students.js"></script>

</body>
</html>
